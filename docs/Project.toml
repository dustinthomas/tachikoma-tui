# Docs-only environment (Documenter is NOT a runtime dep of TachikomaTUI).
# Scaffold for PR0; full docs/make.jl green is a PR11 gate.
#
# Instantiate (path dep declared below; works on Julia 1.11+ via [sources]):
#   julia --project=docs -e 'using Pkg; Pkg.instantiate()'
# Fallback if sources unsupported:
#   julia --project=docs -e 'using Pkg; Pkg.develop(path=".."); Pkg.instantiate()'

[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
TachikomaTUI = "d5bda6e0-da7d-4e51-9834-c5c3e507adf0"

[compat]
Documenter = "1"
julia = "1.10"

[sources]
TachikomaTUI = {path = ".."}
